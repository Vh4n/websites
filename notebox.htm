<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NoteBox Beta</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#444}
body{background:#eef0f2 center top/cover fixed no-repeat}
.topbar{position:fixed;top:0;left:0;right:0;height:35px;z-index:1000;background:linear-gradient(#696969,#333);border-bottom:3px solid #0088a8;box-shadow:0 1px 3px #555;display:flex;align-items:center;color:#fff}
.brand{width:294px;text-align:center;font:bold 25px Arial;text-shadow:1px 1px 2px #222;line-height:29px}
.brand small{font-size:8px;vertical-align:top}
.nav{display:flex;gap:7px;height:100%;align-items:center}
.nav button{width:34px;height:29px;border:0;background:transparent;color:#ddd;font-size:21px;cursor:pointer;opacity:.75}
.nav button:hover{opacity:1}
.top-actions{margin-left:auto;display:flex;height:100%}
.top-actions>button{width:145px;border:0;border-left:1px solid #666;background:linear-gradient(#6c6c6c,#3e3e3e);color:#fff;font-weight:bold;cursor:pointer}
.top-actions>button:hover{background:linear-gradient(#777,#494949)}
.top-actions .google-login{width:170px;font-size:12px}
#googleArea{height:100%;display:flex;align-items:center}
.google-user{display:flex;align-items:center;gap:7px;height:100%;padding:0 8px;font-size:11px}
.google-user img{width:23px;height:23px;border-radius:50%}
.google-user .google-login{width:70px;height:29px;border:0;border-left:1px solid #666;background:linear-gradient(#6c6c6c,#3e3e3e);color:#fff;cursor:pointer}
.app{display:grid;grid-template-columns:195px minmax(500px,1fr);max-width:1280px;margin:0 auto;padding-top:42px;min-height:100vh}
.sidebar{padding:7px 7px 20px 0}
.categories{border-right:1px solid #d1d1d1;padding-right:7px;min-height:480px}
.category{height:21px;border-bottom:1px solid #d4d4d4;padding:3px 7px;color:#167096;font-weight:bold;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.category:hover,.category.active{background:rgba(255,255,255,.55);color:#0088a8}
.category.inbox{font-weight:bold}
.cat-tools{display:flex;justify-content:flex-end;gap:5px;padding:9px 5px}
.cat-tools button{width:27px;height:22px;border:0;border-radius:3px;background:#ddd;cursor:pointer;box-shadow:0 1px 2px #aaa}
.cat-tools button:hover{background:#ccc}
.content{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:7px 0 20px 6px;align-content:start}
.note-column{min-width:0}
.note{border:1px solid #d4d7d9;border-radius:6px;background:linear-gradient(110deg,#fff,#f5f6f7);box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:6px;overflow:hidden}
.note-head{height:28px;display:flex;align-items:center;padding:0 7px;border-bottom:1px solid #e3e3e3;background:linear-gradient(#fff,#f2f3f4);cursor:pointer}
.note-head:hover{background:linear-gradient(#fff,#e9ebed)}
.note-title{font:bold 13px Georgia,serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-actions{display:flex;gap:20px;align-items:center;font-size:10px;margin-left:8px}
.note-actions span{cursor:pointer;color:#444}
.note-actions span:hover{color:#0088a8;text-decoration:underline}
.note-body{min-height:65px;padding:10px 12px 12px;text-align:center;color:#008da9;font-size:12px;white-space:pre-wrap;word-break:break-word}
.note-body a{color:#008da9}
.note-footer{padding:0 8px 6px;color:#9aa0a4;font:italic 9px Georgia,serif;display:flex;justify-content:space-between}
.note.collapsed .note-body,.note.collapsed .note-footer{display:none}
.note.collapsed .note-head{border-bottom:0}
.empty{border:1px dashed #ccd0d3;border-radius:6px;padding:30px 10px;text-align:center;color:#999;background:rgba(255,255,255,.35)}
.search{position:fixed;right:20px;top:42px;width:230px;display:none;z-index:900}
.search input{width:100%;padding:7px;border:1px solid #bbb;border-radius:4px;box-shadow:0 1px 3px #aaa}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:2000;align-items:center;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{width:540px;max-width:calc(100vw - 30px);background:#f5f6f7;border-radius:7px;box-shadow:0 8px 35px rgba(0,0,0,.45);overflow:hidden}
.modal-head{padding:10px 14px;background:linear-gradient(#666,#333);color:#fff;font-weight:bold;font-size:14px}
.modal-body{padding:14px}
.field{margin-bottom:11px}
.field label{display:block;font-weight:bold;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid #bbb;border-radius:4px;padding:7px;font:12px Arial;background:#fff}
.field textarea{height:190px;resize:vertical}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:10px 14px;background:#e7e9eb;border-top:1px solid #d1d3d5}
.btn{border:1px solid #aaa;border-radius:4px;background:linear-gradient(#fff,#ddd);padding:7px 14px;cursor:pointer}
.btn:hover{background:linear-gradient(#fff,#ccc)}
.btn.primary{background:linear-gradient(#14a5bf,#007f99);border-color:#006d83;color:#fff}
.btn.danger{background:linear-gradient(#ef7777,#c94242);border-color:#a83232;color:#fff}
.category-list{max-height:300px;overflow:auto;border:1px solid #ccc;background:#fff}
.category-row{display:flex;align-items:center;padding:6px 8px;border-bottom:1px solid #eee}
.category-row:last-child{border-bottom:0}
.category-row span{flex:1}
.category-row button{margin-left:5px}
.settings-section{border:1px solid #d1d3d5;border-radius:5px;background:#fff;margin-bottom:12px;overflow:hidden}
.settings-section:last-child{margin-bottom:0}
.settings-section-title{padding:7px 9px;background:linear-gradient(#eee,#ddd);border-bottom:1px solid #ccc;font-weight:bold;color:#555}
.settings-section-body{padding:11px}
.settings-actions{display:flex;gap:7px}
.settings-actions .btn{flex:1}
.file-note{font-size:10px;color:#777;margin-top:4px}
.storage-status{position:fixed;bottom:8px;right:10px;padding:4px 8px;background:rgba(255,255,255,.85);border:1px solid #ccc;border-radius:4px;color:#777;font-size:10px;z-index:1100}
.storage-status.google{color:#0088a8}
.storage-status.error{color:#c33}
@media(max-width:800px){
.app{grid-template-columns:150px minmax(0,1fr)}
.brand{width:150px}
.top-actions>button{width:105px}
.content{grid-template-columns:1fr}
}
@media(max-width:560px){
.topbar{height:auto;min-height:35px;flex-wrap:wrap}
.brand{width:130px}
.nav{display:none}
.top-actions{margin-left:auto}
.top-actions>button{width:90px}
.app{grid-template-columns:1fr;padding-top:42px}
.sidebar{padding:5px}
.categories{min-height:0;border-right:0}
.content{padding:5px;grid-template-columns:1fr}
.storage-status{bottom:5px;right:5px}
}
</style>
</head>
<body>

<header class="topbar">
<div class="brand">NoteBox<small>Beta</small></div>
<nav class="nav">
<button title="Home" onclick="selectCategory(currentCategory)">⌂</button>
<button title="Search" onclick="toggleSearch()">⌕</button>
<button title="Settings" onclick="openSettings()">⚙</button>
</nav>
<div class="top-actions">
<button onclick="openNote()">Send note</button>
<button onclick="openNote()">Add note</button>
<div id="googleArea">
<button class="google-login" onclick="loginGoogle()">Login with Google</button>
</div>
</div>
</header>

<input id="jsonFile" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)">

<div class="search" id="searchBox">
<input id="searchInput" placeholder="Search notes..." oninput="renderNotes()">
</div>

<div id="storageStatus" class="storage-status">Local storage</div>

<main class="app">
<aside class="sidebar">
<div class="categories" id="categories"></div>
<div class="cat-tools">
<button title="Edit categories" onclick="openCategories()">✂</button>
</div>
</aside>

<section class="content" id="content">
<div class="note-column" id="column1"></div>
<div class="note-column" id="column2"></div>
</section>
</main>

<div class="modal-backdrop" id="noteModal">
<div class="modal">
<div class="modal-head" id="noteModalTitle">Add note</div>
<div class="modal-body">
<div class="field"><label>Title</label><input id="noteTitle"></div>
<div class="field"><label>Category</label><select id="noteCategory"></select></div>
<div class="field"><label>Body</label><textarea id="noteBody"></textarea></div>
</div>
<div class="modal-foot">
<button class="btn" onclick="closeModal('noteModal')">Cancel</button>
<button class="btn primary" onclick="saveNote()">Save</button>
</div>
</div>
</div>

<div class="modal-backdrop" id="categoryModal">
<div class="modal">
<div class="modal-head">Categories</div>
<div class="modal-body">
<div class="category-list" id="categoryList"></div>
<div style="margin-top:10px"><button class="btn primary" onclick="addCategory()">Add category</button></div>
</div>
<div class="modal-foot">
<button class="btn" onclick="closeModal('categoryModal')">Close</button>
</div>
</div>
</div>

<div class="modal-backdrop" id="categoryEditModal">
<div class="modal">
<div class="modal-head" id="categoryEditTitle">Add category</div>
<div class="modal-body">
<div class="field"><label>Name</label><input id="categoryName"></div>
</div>
<div class="modal-foot">
<button class="btn" onclick="closeModal('categoryEditModal')">Cancel</button>
<button class="btn primary" onclick="saveCategory()">Save</button>
</div>
</div>
</div>

<div class="modal-backdrop" id="settingsModal">
<div class="modal">
<div class="modal-head">NoteBox settings</div>
<div class="modal-body">

<div class="settings-section">
<div class="settings-section-title">Wallpaper</div>
<div class="settings-section-body">
<div class="field">
<label>Wallpaper URL</label>
<input id="wallpaperUrl" placeholder="https://example.com/wallpaper.jpg">
<div class="file-note">Enter an image URL to use as the NoteBox background.</div>
</div>
<div class="settings-actions">
<button class="btn primary" onclick="saveWallpaper()">Save wallpaper</button>
<button class="btn" onclick="resetWallpaper()">Reset wallpaper</button>
</div>
</div>
</div>

<div class="settings-section">
<div class="settings-section-title">Data management</div>
<div class="settings-section-body">
<div class="settings-actions">
<button class="btn" onclick="document.getElementById('jsonFile').click()">Import JSON</button>
<button class="btn" onclick="exportJSON()">Export current data</button>
</div>
</div>
</div>

</div>
<div class="modal-foot">
<button class="btn" onclick="closeModal('settingsModal')">Close</button>
</div>
</div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>

<script>
const GGLCLNT="372884402537-m1d9079vedc6pjhkqfgbud5g99rfnoqo.apps.googleusercontent.com";
const GGLAPKY="AIzaSyB4YVf42_lqCBbo3mk8-lDoC2uNzenrusI";
const GGLSCPS="openid email profile https://www.googleapis.com/auth/drive";
const DATABASE_FILENAME="noteboxdatabase.json";
const LOCAL_STORAGE_KEY="notebox_data_v1";
const LOCAL_WALLPAPER_KEY="notebox_wallpaper_v1";
const GOOGLE_SESSION_KEY="notebox_google_session_v1";

let currentCategory="Inbox";
let editingNoteIndex=null;
let editingCategoryIndex=null;
let data=loadLocalData();
let googleTokenClient=null;
let googleAccessToken=null;
let googleUser=null;
let googleDatabaseFile=null;
let googleLoginInProgress=false;
let googleSilentLoginInProgress=false;

function defaultData(){return{USERDATA:{ODATA:{EMAIL:"",INBOX:"false",LOGIN:"",PASS:"",STATE:"off"},OPDATA:{BIRTHDATE:"",FRNDCATEGORIES:[{NAME:"General"}],PSTCATEGORIES:[{NAME:"Inbox"},{NAME:"My First Category"},{NAME:"otra"}],WALLPAPER:""}},POSTSDATA:[]};}

function normalizeData(raw){
let d=raw||defaultData();
if(!d.USERDATA)d.USERDATA=defaultData().USERDATA;
if(!d.USERDATA.ODATA)d.USERDATA.ODATA=defaultData().USERDATA.ODATA;
if(!d.USERDATA.OPDATA)d.USERDATA.OPDATA=defaultData().USERDATA.OPDATA;
if(!Array.isArray(d.USERDATA.OPDATA.PSTCATEGORIES))d.USERDATA.OPDATA.PSTCATEGORIES=[];
if(!d.USERDATA.OPDATA.PSTCATEGORIES.some(c=>String(c.NAME).toLowerCase()==="inbox"))d.USERDATA.OPDATA.PSTCATEGORIES.unshift({NAME:"Inbox"});
if(!Array.isArray(d.POSTSDATA)){if(d.POSTSDATA&&typeof d.POSTSDATA==="object")d.POSTSDATA=[d.POSTSDATA];else d.POSTSDATA=[];}
return d;
}

function loadLocalData(){
try{
const saved=localStorage.getItem(LOCAL_STORAGE_KEY);
return normalizeData(saved?JSON.parse(saved):defaultData());
}catch(e){
console.error("Local data error:",e);
return defaultData();
}
}

function saveLocalData(){
if(googleAccessToken)return;
localStorage.setItem(LOCAL_STORAGE_KEY,JSON.stringify(data));
}

function saveData(){
if(googleAccessToken)saveToGoogleDrive();
else{
saveLocalData();
updateStorageStatus("Local storage");
}
}

function getCategories(){
return data.USERDATA.OPDATA.PSTCATEGORIES.map(c=>String(c.NAME)).filter(Boolean);
}

function escapeHTML(v){
return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function noteTitle(n){return n?.MAINSTRCT?.TITLE||"Untitled";}
function noteBody(n){return n?.MAINSTRCT?.BODY||"";}
function noteCategory(n){return n?.MAINSTRCT?.CATEGORY||"Inbox";}
function noteDate(n){return n?.MAINSTRCT?.DATEMODIFIED||n?.MAINSTRCT?.DATECREATE||"";}

function renderCategories(){
const el=document.getElementById("categories");
const cats=getCategories();
el.innerHTML="";
cats.forEach(c=>{
const div=document.createElement("div");
div.className="category"+(c===currentCategory?" active":"")+(c==="Inbox"?" inbox":"");
div.textContent="."+c;
div.title=c;
div.onclick=()=>selectCategory(c);
el.appendChild(div);
});
}

function selectCategory(category){
currentCategory=category;
renderCategories();
renderNotes();
}

function renderNotes(){
const filter=(document.getElementById("searchInput")?.value||"").toLowerCase().trim();
const notes=data.POSTSDATA.filter(n=>noteCategory(n)===currentCategory&&(!filter||(noteTitle(n)+" "+noteBody(n)).toLowerCase().includes(filter)));
const a=document.getElementById("column1");
const b=document.getElementById("column2");
a.innerHTML="";
b.innerHTML="";
notes.forEach((n,i)=>{
const originalIndex=data.POSTSDATA.indexOf(n);
const card=buildNote(n,originalIndex);
if(i%2===0)a.appendChild(card);
else b.appendChild(card);
});
if(!notes.length)a.innerHTML='<div class="empty">No notes in <b>'+escapeHTML(currentCategory)+'</b>.<br><br>Use <b>Add note</b> to create one.</div>';
}

function buildNote(n,index){
const card=document.createElement("article");
card.className="note";
card.dataset.index=index;
card.innerHTML='<div class="note-head"><div class="note-title">'+escapeHTML(noteTitle(n))+'</div><div class="note-actions"><span class="modify">modify</span><span class="share">share</span><span class="delete">×</span></div></div><div class="note-body">'+formatBody(noteBody(n))+'</div><div class="note-footer"><span>on .'+escapeHTML(noteCategory(n))+'</span><span>'+escapeHTML(formatDate(noteDate(n)))+' by '+escapeHTML(n?.MAINSTRCT?.AUTOR||"you")+'</span></div>';
card.querySelector(".note-head").onclick=e=>{
if(e.target.closest(".note-actions"))return;
card.classList.toggle("collapsed");
};
card.querySelector(".modify").onclick=()=>openNote(index);
card.querySelector(".delete").onclick=()=>deleteNote(index);
card.querySelector(".share").onclick=()=>shareNote(index);
return card;
}

function formatBody(body){
let s=escapeHTML(body).replace(/\n/g,"<br>");
s=s.replace(/&amp;#91;url ([^&]+)&amp;#93;(.+?)&amp;#91;\/url&amp;#93;/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
s=s.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
return s;
}

function formatDate(v){
if(!v)return "";
const p=String(v).split("/");
if(p.length>=3)return p[1]+"/"+p[2]+"/"+p[0];
return v;
}

function stripHTML(s){
return String(s).replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"");
}

function openNote(index=null){
editingNoteIndex=index;
document.getElementById("noteModalTitle").textContent=index===null?"Add note":"Modify note";
const cats=getCategories();
const select=document.getElementById("noteCategory");
select.innerHTML=cats.map(c=>'<option value="'+escapeHTML(c)+'">'+escapeHTML(c)+'</option>').join("");

if(index===null){
document.getElementById("noteTitle").value="";
document.getElementById("noteBody").value="";
select.value=currentCategory;
}else{
const n=data.POSTSDATA[index];
document.getElementById("noteTitle").value=noteTitle(n);
document.getElementById("noteBody").value=stripHTML(n?.MAINSTRCT?.BODY||"");
select.value=noteCategory(n);
}
showModal("noteModal");
}

function createDateString(){
const now=new Date();
return now.getFullYear()+"/"+String(now.getMonth()+1).padStart(2,"0")+"/"+String(now.getDate()).padStart(2,"0")+"/"+String(now.getHours()).padStart(2,"0")+"/"+String(now.getMinutes()).padStart(2,"0")+"/"+String(now.getSeconds()).padStart(2,"0");
}

function createObjectId(){
if(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function")return crypto.randomUUID().replaceAll("-","").slice(0,24);
return Date.now().toString(16).padStart(24,"0").slice(-24);
}

function saveNote(){
const title=document.getElementById("noteTitle").value.trim()||"Untitled";
const body=document.getElementById("noteBody").value;
const category=document.getElementById("noteCategory").value;
const date=createDateString();

if(editingNoteIndex===null){
data.POSTSDATA.unshift({
_id:{$oid:createObjectId()},
MAINSTRCT:{
AUTOR:data.USERDATA.ODATA.LOGIN||"you",
OWNER:"",
TITLE:title,
BODY:body,
DATECREATE:date,
DATEMODIFIED:date,
CATEGORY:category
},
CFGSTRCT:{
MAINPAGE:"false",
PUBLIC:"false",
COLLAPSED:"false",
REMINDDATE:"false",
DATEREMIND:{DATE:"",CONFIRMED:"false",REMIND:"false"}
}
});
}else{
const n=data.POSTSDATA[editingNoteIndex];
n.MAINSTRCT=n.MAINSTRCT||{};
n.MAINSTRCT.TITLE=title;
n.MAINSTRCT.BODY=body;
n.MAINSTRCT.CATEGORY=category;
n.MAINSTRCT.DATEMODIFIED=date;
}

saveData();
closeModal("noteModal");
currentCategory=category;
renderCategories();
renderNotes();
}

function deleteNote(index){
const n=data.POSTSDATA[index];
if(!confirm('Delete "'+noteTitle(n)+'"?'))return;
data.POSTSDATA.splice(index,1);
saveData();
renderNotes();
}

async function shareNote(index){
const n=data.POSTSDATA[index];
const text=noteTitle(n)+"\n\n"+stripHTML(noteBody(n));
try{
await navigator.clipboard.writeText(text);
alert("Note copied to clipboard.");
}catch(e){
prompt("Copy note:",text);
}
}

function addCategory(){
editingCategoryIndex=null;
document.getElementById("categoryEditTitle").textContent="Add category";
document.getElementById("categoryName").value="";
showModal("categoryEditModal");
}

function editCategory(index){
editingCategoryIndex=index;
document.getElementById("categoryEditTitle").textContent="Edit category";
document.getElementById("categoryName").value=getCategories()[index];
showModal("categoryEditModal");
}

function saveCategory(){
const name=document.getElementById("categoryName").value.trim();
if(!name)return;

const cats=getCategories();

if(cats.some((c,i)=>c.toLowerCase()===name.toLowerCase()&&i!==editingCategoryIndex)){
alert("That category already exists.");
return;
}

if(editingCategoryIndex===null){
data.USERDATA.OPDATA.PSTCATEGORIES.push({NAME:name});
}else{
const old=cats[editingCategoryIndex];
data.USERDATA.OPDATA.PSTCATEGORIES[editingCategoryIndex].NAME=name;
data.POSTSDATA.forEach(n=>{
if(noteCategory(n)===old)n.MAINSTRCT.CATEGORY=name;
});
if(currentCategory===old)currentCategory=name;
}

saveData();
closeModal("categoryEditModal");
renderCategories();
renderNotes();

if(document.getElementById("categoryModal").classList.contains("show"))renderCategoryManager();
}

function removeCategory(index){
const cats=getCategories();
const name=cats[index];

if(name==="Inbox"){
alert("Inbox cannot be deleted.");
return;
}

if(!confirm('Delete category "'+name+'"? Notes will be moved to Inbox.'))return;

data.POSTSDATA.forEach(n=>{
if(noteCategory(n)===name)n.MAINSTRCT.CATEGORY="Inbox";
});

data.USERDATA.OPDATA.PSTCATEGORIES.splice(index,1);

if(currentCategory===name)currentCategory="Inbox";

saveData();
renderCategories();
renderNotes();
renderCategoryManager();
}

function openCategories(){
renderCategoryManager();
showModal("categoryModal");
}

function renderCategoryManager(){
document.getElementById("categoryList").innerHTML=getCategories().map((c,i)=>'<div class="category-row"><span>'+escapeHTML(c)+'</span><button class="btn" onclick="editCategory('+i+')">Edit</button><button class="btn danger" onclick="removeCategory('+i+')">Delete</button></div>').join("");
}

function openSettings(){
document.getElementById("wallpaperUrl").value=data.USERDATA.OPDATA.WALLPAPER||localStorage.getItem(LOCAL_WALLPAPER_KEY)||"";
showModal("settingsModal");
}

function saveWallpaper(){
const url=document.getElementById("wallpaperUrl").value.trim();

data.USERDATA.OPDATA.WALLPAPER=url;

if(url){
localStorage.setItem(LOCAL_WALLPAPER_KEY,url);
document.body.style.backgroundImage='url("'+url.replace(/"/g,'\\"')+'")';
}else{
localStorage.removeItem(LOCAL_WALLPAPER_KEY);
document.body.style.backgroundImage="none";
}

saveData();
}

function resetWallpaper(){
data.USERDATA.OPDATA.WALLPAPER="";
localStorage.removeItem(LOCAL_WALLPAPER_KEY);
document.getElementById("wallpaperUrl").value="";
document.body.style.backgroundImage="none";
saveData();
}

function applyWallpaper(){
const w=localStorage.getItem(LOCAL_WALLPAPER_KEY)||data.USERDATA.OPDATA.WALLPAPER;
if(w)document.body.style.backgroundImage='url("'+w.replace(/"/g,'\\"')+'")';
else document.body.style.backgroundImage="none";
}

function exportJSON(){
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=DATABASE_FILENAME;
a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function importJSON(event){
const file=event.target.files[0];
if(!file)return;

const reader=new FileReader();

reader.onload=()=>{
try{
data=normalizeData(JSON.parse(reader.result));
currentCategory=getCategories().includes(currentCategory)?currentCategory:(getCategories()[0]||"Inbox");

if(!googleAccessToken)saveLocalData();

renderCategories();
renderNotes();
applyWallpaper();

if(googleAccessToken)saveToGoogleDrive();

alert("JSON loaded successfully.");
}catch(e){
console.error(e);
alert("Invalid JSON file.");
}

event.target.value="";
};

reader.readAsText(file);
}

function toggleSearch(){
const s=document.getElementById("searchBox");

if(s.style.display==="block"){
s.style.display="none";
document.getElementById("searchInput").value="";
renderNotes();
}else{
s.style.display="block";
document.getElementById("searchInput").focus();
}
}

function loginGoogle(){
requestGoogleAccessToken(false);
}

function hasGoogleSession(){
return localStorage.getItem(GOOGLE_SESSION_KEY)==="true";
}

function refreshGoogleSession(){
localStorage.setItem(GOOGLE_SESSION_KEY,"true");
}

function clearGoogleSession(){
localStorage.removeItem(GOOGLE_SESSION_KEY);
}

function requestGoogleAccessToken(silent){
if(googleLoginInProgress||googleSilentLoginInProgress)return;

if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2){
if(!silent)alert("Google authentication could not be loaded.");
return;
}

if(silent)googleSilentLoginInProgress=true;
else googleLoginInProgress=true;

updateStorageStatus(silent?"Restoring Google session...":"Connecting to Google...");

googleTokenClient=google.accounts.oauth2.initTokenClient({
client_id:GGLCLNT,
scope:GGLSCPS,
callback:async function(response){

googleLoginInProgress=false;
googleSilentLoginInProgress=false;

if(response.error){
console.log("Google authentication failed:",response);

googleAccessToken=null;
googleUser=null;
googleDatabaseFile=null;

if(silent){
clearGoogleSession();
updateGoogleUI();
updateStorageStatus("Local storage");
}else{
updateStorageStatus("Google login failed","error");
alert("Google login failed: "+(response.error_description||response.error||"Unknown Google OAuth error."));
}

return;
}

if(response.access_token){
googleAccessToken=response.access_token;

try{
await loadGoogleUser();
await loadDatabaseFromGoogle();

refreshGoogleSession();
updateGoogleUI();

}catch(error){
console.error("Google Drive error:",error);

googleAccessToken=null;
googleUser=null;
googleDatabaseFile=null;

if(silent){
clearGoogleSession();
updateGoogleUI();
updateStorageStatus("Local storage");
}else{
updateGoogleUI();
updateStorageStatus("Google Drive error","error");
alert("Google Drive could not be loaded: "+(error.message||error));
}
}
}
}
});

try{
googleTokenClient.requestAccessToken({
prompt:silent?"none":"select_account"
});
}catch(error){
googleLoginInProgress=false;
googleSilentLoginInProgress=false;

console.error("Google token request error:",error);

if(silent){
clearGoogleSession();
updateGoogleUI();
updateStorageStatus("Local storage");
}else{
updateStorageStatus("Google login failed","error");
alert("Google login failed: "+(error.message||error));
}
}
}

async function loadGoogleUser(){
const response=await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{
headers:{Authorization:"Bearer "+googleAccessToken}
});

if(!response.ok){
const text=await response.text();
throw new Error("Unable to retrieve Google account information. HTTP "+response.status+(text?" - "+text:""));
}

googleUser=await response.json();
}

async function findGoogleDatabase(){
const q="name='"+DATABASE_FILENAME.replace(/'/g,"\\'")+"' and trashed=false";

const url="https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(q)+"&spaces=drive&fields=files(id,name,mimeType,parents,modifiedTime)";

const response=await fetch(url,{
headers:{
Authorization:"Bearer "+googleAccessToken,
"x-goog-api-key":GGLAPKY
}
});

if(!response.ok){
const text=await response.text();
throw new Error("Unable to search Google Drive. HTTP "+response.status+(text?" - "+text:""));
}

const result=await response.json();

if(result.files&&result.files.length)return result.files[0];

return null;
}

async function loadDatabaseFromGoogle(){
updateStorageStatus("Loading Google Drive...");

googleDatabaseFile=await findGoogleDatabase();

if(!googleDatabaseFile){
data=normalizeData(data);
await createGoogleDatabase();
}else{

const response=await fetch(
"https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(googleDatabaseFile.id)+"?alt=media",
{
headers:{Authorization:"Bearer "+googleAccessToken}
}
);

if(!response.ok){
throw new Error("Unable to download "+DATABASE_FILENAME+". HTTP "+response.status);
}

const text=await response.text();

try{
data=normalizeData(JSON.parse(text));
}catch(e){
throw new Error(DATABASE_FILENAME+" does not contain valid JSON.");
}
}

currentCategory=getCategories().includes(currentCategory)?currentCategory:(getCategories()[0]||"Inbox");

renderCategories();
renderNotes();
applyWallpaper();
updateStorageStatus("Google Drive");
}

async function createGoogleDatabase(){
const metadata={
name:DATABASE_FILENAME,
mimeType:"application/json"
};

const boundary="-------NoteBoxBoundary"+Date.now();

const body=
"--"+boundary+"\r\n"+
"Content-Type: application/json; charset=UTF-8\r\n\r\n"+
JSON.stringify(metadata)+"\r\n"+
"--"+boundary+"\r\n"+
"Content-Type: application/json\r\n\r\n"+
JSON.stringify(data)+"\r\n"+
"--"+boundary+"--";

const response=await fetch(
"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
{
method:"POST",
headers:{
Authorization:"Bearer "+googleAccessToken,
"Content-Type":"multipart/related; boundary="+boundary
},
body:body
}
);

if(!response.ok){
const text=await response.text();
throw new Error("Unable to create "+DATABASE_FILENAME+". HTTP "+response.status+(text?" - "+text:""));
}

googleDatabaseFile=await response.json();
}

async function saveToGoogleDrive(){
if(!googleAccessToken){
saveLocalData();
return;
}

if(!googleDatabaseFile){
try{
googleDatabaseFile=await findGoogleDatabase();
}catch(error){
console.error(error);
updateStorageStatus("Google Drive error","error");
return;
}
}

if(!googleDatabaseFile){
try{
await createGoogleDatabase();
updateStorageStatus("Saved to Google Drive");
}catch(error){
console.error(error);
updateStorageStatus("Google Drive error","error");
}
return;
}

updateStorageStatus("Saving...");

const body=JSON.stringify(data);

const response=await fetch(
"https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(googleDatabaseFile.id)+"?uploadType=media",
{
method:"PATCH",
headers:{
Authorization:"Bearer "+googleAccessToken,
"Content-Type":"application/json"
},
body:body
}
);

if(!response.ok){
const text=await response.text();
console.error("Google Drive save failed:",response.status,text);
updateStorageStatus("Google Drive error","error");
return;
}

updateStorageStatus("Saved to Google Drive");
}

function logoutGoogle(){
if(googleAccessToken){
try{
google.accounts.oauth2.revoke(googleAccessToken,function(){
finishGoogleLogout();
});
}catch(e){
finishGoogleLogout();
}
}else{
finishGoogleLogout();
}
}

function finishGoogleLogout(){
googleAccessToken=null;
googleTokenClient=null;
googleUser=null;
googleDatabaseFile=null;
googleLoginInProgress=false;
googleSilentLoginInProgress=false;

clearGoogleSession();

data=loadLocalData();

currentCategory=getCategories().includes(currentCategory)?currentCategory:(getCategories()[0]||"Inbox");

renderCategories();
renderNotes();
applyWallpaper();
updateGoogleUI();
updateStorageStatus("Local storage");
}

function restoreGoogleSession(){
if(!hasGoogleSession()){
updateGoogleUI();
updateStorageStatus("Local storage");
return;
}

if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2){
setTimeout(restoreGoogleSession,250);
return;
}

requestGoogleAccessToken(true);
}

function updateGoogleUI(){
const area=document.getElementById("googleArea");

if(googleAccessToken&&googleUser){

const image=googleUser.picture?
'<img src="'+escapeHTML(googleUser.picture)+'">':
"";

area.innerHTML=
'<div class="google-user">'+
image+
'<span>'+escapeHTML(googleUser.name||googleUser.email||"Google")+'</span>'+
'<button class="google-login" onclick="logoutGoogle()">Log Out</button>'+
'</div>';

}else{

area.innerHTML=
'<button class="google-login" onclick="loginGoogle()">Login with Google</button>';

}
}

function updateStorageStatus(text,type=""){
const el=document.getElementById("storageStatus");

el.textContent=text;

el.className=
"storage-status"+
(type?" "+type:"")+
(
text.toLowerCase().includes("google")||
text.toLowerCase().includes("saved")||
text.toLowerCase().includes("saving")||
text.toLowerCase().includes("restoring")
?" google":""
);
}

function showModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

document.addEventListener("keydown",e=>{
if(e.key==="Escape"){
document.querySelectorAll(".modal-backdrop.show").forEach(x=>x.classList.remove("show"));
}

if(e.ctrlKey&&e.key.toLowerCase()==="f"){
e.preventDefault();
toggleSearch();
}
});

document.querySelectorAll(".modal-backdrop").forEach(m=>{
m.addEventListener("click",e=>{
if(e.target===m)m.classList.remove("show");
});
});

applyWallpaper();
renderCategories();
renderNotes();
updateGoogleUI();
updateStorageStatus("Local storage");

setTimeout(restoreGoogleSession,100);
</script>
</body>
</html>
