<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shortcuts</title>
    <style>
      :root {
        --card: rgba(27, 27, 27, .82);
        --hover: #252525;
        --text: #eee;
        --accent: #4da3ff;
        --border: #333;
        --shadow: 0 8px 25px rgba(0, 0, 0, .35);
        --background-overlay: rgba(0, 0, 0, .10);
      }

      body.light {
        --card: rgba(255, 255, 255, .85);
        --hover: #e9e9e9;
        --text: #111;
        --accent: #1677ff;
        --border: #ccc;
        --shadow: 0 8px 25px rgba(0, 0, 0, .15);
        --background-overlay: rgba(255, 255, 255, .10);
      }

      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: auto;
        color: var(--text);
        background:
          linear-gradient(var(--background-overlay), var(--background-overlay)),
          var(--background-image, none);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      #pageTitle {
        position: absolute;
        left: 25px;
        top: 20px;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
        z-index: 5000;
        color: #ddd;
      }

      body.light #pageTitle {
        color: #ddd;
      }

      #pageTitle input {
        font-size: 28px;
        background: #111;
        color: white;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 4px 8px;
      }

      .topButtons {
        position: absolute;
        right: 25px;
        top: 20px;
        display: flex;
        gap: 8px;
        z-index: 5000;
      }

      .desktop {
        position: relative;
        width: 100%;
        min-height: 100vh;
      }

      .section {
        position: absolute;
        width: 340px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .section.dragging,
      .googleSearch.dragging {
        opacity: .45;
      }

      .section-header {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        cursor: grab;
        user-select: none;
      }

      .section-header:active {
        cursor: grabbing;
      }

      .sectionName {
        flex: 1;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      .sectionName:hover {
        text-decoration: underline;
      }

      .sectionName input {
        width: 100%;
        background: #111;
        color: white;
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 2px 5px;
      }

      body.light .sectionName input {
        background: white;
        color: #111;
      }

      .iconButton {
        background: none;
        border: none;
        color: #888;
        font-size: 17px;
        cursor: pointer;
        padding: 2px 5px;
        z-index: 5;
      }

      .iconButton:hover {
        color: var(--text);
      }

      .links {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .link {
        display: flex;
        align-items: center;
        padding: 8px;
        border-radius: 8px;
        transition: .15s;
        cursor: grab;
      }

      .link.dragging {
        opacity: .4;
      }

      .link:hover {
        background: var(--hover);
      }

      .link a {
        flex: 1;
        color: var(--accent);
        text-decoration: none;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .drop-line {
        height: 3px;
        background: #1677ff;
        border-radius: 5px;
        margin: 3px 0;
      }

      /* Google input */
      .googleSearch {
        position: absolute;
        width: 340px;
        z-index: 4000;
      }

      .googleInput {
        width: 100%;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, .25);
        background: rgba(255, 255, 255, .18);
        color: white;
        font-size: 16px;
        padding: 0 14px;
        outline: none;
        box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
        cursor: grab;
      }

      .googleInput:active {
        cursor: grabbing;
      }

      .googleInput::placeholder {
        color: rgba(255, 255, 255, .75);
      }

      .googleInput:focus {
        border-color: var(--accent);
      }

      body.light .googleInput {
        background: rgba(0, 0, 0, .12);
        color: #111;
      }

      body.light .googleInput::placeholder {
        color: #555;
      }

      .addLinkButton {
        width: calc(100% - 20px);
        margin: 0 10px 10px;
      }

      button {
        background: #222;
        color: white;
        border: 1px solid #444;
        border-radius: 7px;
        padding: 7px 12px;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      body.light button {
        background: #fff;
        color: #111;
        border-color: #bbb;
      }

      body.light button:hover {
        background: #e5e5e5;
      }

      .addSection {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: #1677ff !important;
        color: white !important;
        border: none !important;
        z-index: 6000;
      }

      .exportBox {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: flex;
        gap: 8px;
        z-index: 6000;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .7);
        justify-content: center;
        align-items: center;
        z-index: 7000;
      }

      .modalBox {
        width: min(500px, 90vw);
        background: var(--card);
        padding: 20px;
        border-radius: 12px;
        color: var(--text);
      }

      textarea {
        width: 100%;
        height: 260px;
        resize: none;
        background: #111;
        color: white;
        border: 1px solid #444;
      }

      body.light textarea {
        background: #fff;
        color: #111;
      }

      @media(max-width:700px) {
        #pageTitle {
          left: 15px;
          top: 15px;
          font-size: 24px;
        }

        .topButtons {
          top: 15px;
          right: 15px;
        }

        .desktop {
          padding-top: 70px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px;
        }

        .section,
        .googleSearch {
          position: relative !important;
          left: auto !important;
          top: auto !important;
          width: 92vw;
        }

        .exportBox {
          right: 10px;
          bottom: 10px;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="pageTitle"></div>
    <div class="topButtons">
      <button onclick="changeBackground()">Background</button>
      <button onclick="toggleTheme()" id="themeButton">☀</button>
    </div>
    <div id="desktop" class="desktop"></div>
    <button class="addSection" onclick="addSection()"> + Section </button>
    <div class="exportBox">
      <button onclick="exportJSON()">Export</button>
      <button onclick="importJSON()">Import</button>
    </div>
    <div class="modal" id="jsonModal">
      <div class="modalBox">
        <h3>Import JSON</h3>
        <textarea id="jsonInput"></textarea>
        <br>
        <br>
        <button onclick="loadJSON()">Load</button>
        <button onclick="closeModal()">Cancel</button>
      </div>
    </div>
    <script>
      let data = JSON.parse(localStorage.getItem("favorites")) || {
        title: "Shortcuts",
        background: "",
        theme: "dark",
        nextZ: 1,
        widget: {
          enabled: true,
          x: 60,
          y: 20,
          z: 1
        },
        sections: []
      };

      function normalize() {
        if (!data.nextZ) data.nextZ = 1;
        if (!data.theme) data.theme = "dark";
        if (!data.widget) {
          data.widget = {
            enabled: true,
            x: 60,
            y: 20,
            z: 1
          };
        }
        data.sections.forEach((s, i) => {
          if (s.x == null) s.x = 60 + i * 30;
          if (s.y == null) s.y = 80 + i * 30;
          if (s.z == null) s.z = i + 1;
          if (s.collapsed == null) s.collapsed = false;
          if (!s.links) s.links = [];
        });
        applyTheme();
      }

      function applyTheme() {
        document.body.classList.toggle("light", data.theme === "light");
        document.getElementById("themeButton").innerHTML = data.theme === "dark" ? "☀" : "🌙";
      }
      normalize();

      function save() {
        localStorage.setItem("favorites", JSON.stringify(data));
        applyTheme();
        render();
      }

      function toggleTheme() {
        data.theme = data.theme === "dark" ? "light" : "dark";
        save();
      }

      function render() {
        document.getElementById("pageTitle").innerHTML = data.title;
        if (data.background) {
          document.body.style.setProperty("--background-image", `url("${data.background}")`);
        }
        let html = "";
        if (data.widget.enabled) {
          html += `


							<div class="googleSearch"
style="
left:${data.widget.x}px;
top:${data.widget.y}px;
z-index:${data.widget.z};
"
data-widget="true">
								<input
id="googleInput"
class="googleInput"
placeholder="Type+enter to google"
onmousedown="startWidgetDrag(event)"
onkeydown="googleSearch(event)"
>
								</div>

`;
        }
        data.sections.forEach((section, s) => {
          html += `


								<div class="section"
style="
left:${section.x}px;
top:${section.y}px;
z-index:${section.z};
"
data-index="${s}">
									<div class="section-header"
onmousedown="startSectionAction(event,${s})">
										<div class="sectionName"
onclick="toggleSection(${s})"
ondblclick="event.stopPropagation();editSectionTitle(${s})">

${section.title}

</div>
										<button class="iconButton"
onclick="event.stopPropagation();editSectionTitle(${s})">
✏
</button>
										<button class="iconButton"
onclick="event.stopPropagation();deleteSection(${s})">
×
</button>
									</div>

`;
          if (!section.collapsed) {
            html += `


									<div class="links">

`;
            section.links.forEach((link, l) => {
              html += `


										<div class="link"
draggable="true"
ondragstart="linkDragStart(event,${s},${l})"
ondragover="linkDragOver(event,${s},${l})"
ondrop="linkDrop(event,${s},${l})"
ondragleave="clearDrop()">
											<a href="${link.url}">
${link.title}
</a>
											<button class="iconButton"
onclick="deleteLink(${s},${l})">
×
</button>
										</div>

`;
            });
            html += `


									</div>
									<button class="addLinkButton"
onclick="addLink(${s})">
+ Add Link
</button>

`;
          }
          html += `


								</div>

`;
        });
        document.getElementById("desktop").innerHTML = html;
        setTimeout(() => {
          let input = document.getElementById("googleInput");
          if (input) {
            input.focus();
          }
        }, 100);
      }

      function googleSearch(e) {
        if (e.key === "Enter") {
          let text = e.target.value.trim();
          if (!text) return;
          window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(text) + "&udm=14";
        }
      }
      /* GOOGLE INPUT DRAG */
      let widgetDragging = false;
      let widgetStartX = 0;
      let widgetStartY = 0;
      let widgetOriginalX = 0;
      let widgetOriginalY = 0;
      let widgetMoved = false;

      function startWidgetDrag(e) {
        widgetDragging = true;
        widgetMoved = false;
        widgetStartX = e.clientX;
        widgetStartY = e.clientY;
        widgetOriginalX = data.widget.x;
        widgetOriginalY = data.widget.y;
        data.widget.z = ++data.nextZ;
        document.addEventListener("mousemove", moveWidget);
        document.addEventListener("mouseup", endWidgetDrag);
      }

      function moveWidget(e) {
        if (!widgetDragging) return;
        let dx = e.clientX - widgetStartX;
        let dy = e.clientY - widgetStartY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          widgetMoved = true;
          let x = widgetOriginalX + dx;
          let y = widgetOriginalY + dy;
          if (x < 0) x = 0;
          if (y < 0) y = 0;
          data.widget.x = x;
          data.widget.y = y;
          let widget = document.querySelector("[data-widget='true']");
          if (widget) {
            widget.style.left = x + "px";
            widget.style.top = y + "px";
            widget.classList.add("dragging");
          }
        }
      }

      function endWidgetDrag() {
        if (!widgetDragging) return;
        widgetDragging = false;
        let widget = document.querySelector("[data-widget='true']");
        if (widget) widget.classList.remove("dragging");
        document.removeEventListener("mousemove", moveWidget);
        document.removeEventListener("mouseup", endWidgetDrag);
        if (widgetMoved) {
          save();
        }
      }
      /* TITLE */
      document.getElementById("pageTitle").onclick = function() {
        let input = document.createElement("input");
        input.value = data.title;
        this.innerHTML = "";
        this.appendChild(input);
        input.focus();
        input.onkeydown = function(e) {
          if (e.key === "Enter") {
            data.title = this.value.trim() || "Shortcuts";
            save();
          }
        };
      };

      function toggleSection(i) {
        data.sections[i].collapsed = !data.sections[i].collapsed;
        save();
      }

      function editSectionTitle(i) {
        let div = document.querySelectorAll(".sectionName")[i];
        let input = document.createElement("input");
        input.value = data.sections[i].title;
        div.innerHTML = "";
        div.appendChild(input);
        input.focus();
        input.onkeydown = function(e) {
          if (e.key === "Enter") {
            data.sections[i].title = this.value.trim() || "Section";
            save();
          }
        };
        input.onblur = function() {
          data.sections[i].title = this.value.trim() || "Section";
          save();
        };
      }
      /* SECTIONS */
      function addSection() {
        let title = prompt("Section name:");
        if (!title) return;
        data.sections.push({
          title: title,
          collapsed: false,
          x: 60,
          y: 80,
          z: ++data.nextZ,
          links: []
        });
        save();
      }

      function deleteSection(i) {
        if (confirm("Delete section?")) {
          data.sections.splice(i, 1);
          save();
        }
      }
      /* LINKS */
      function addLink(section) {
        let url = prompt("Website URL:");
        if (!url) return;
        if (!url.startsWith("http")) url = "https://" + url;
        let title;
        try {
          title = new URL(url).hostname.replace("www.", "");
        } catch {
          title = url;
        }
        let custom = prompt("Link title:", title);
        if (custom) title = custom;
        data.sections[section].links.push({
          title: title,
          url: url
        });
        save();
      }

      function deleteLink(s, l) {
        data.sections[s].links.splice(l, 1);
        save();
      }
      /* SECTION DRAG */
      let dragSection = null;
      let dragStartX = 0;
      let dragStartY = 0;
      let originalX = 0;
      let originalY = 0;
      let moved = false;

      function startSectionAction(e, index) {
        if (e.target.classList.contains("iconButton") || e.target.tagName === "INPUT") return;
        dragSection = index;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        originalX = data.sections[index].x;
        originalY = data.sections[index].y;
        moved = false;
        document.addEventListener("mousemove", sectionMove);
        document.addEventListener("mouseup", sectionUp);
      }

      function sectionMove(e) {
        if (dragSection === null) return;
        let dx = e.clientX - dragStartX;
        let dy = e.clientY - dragStartY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          moved = true;
          let x = originalX + dx;
          let y = originalY + dy;
          if (x < 0) x = 0;
          if (y < 0) y = 0;
          data.sections[dragSection].x = x;
          data.sections[dragSection].y = y;
          let section = document.querySelector(`[data-index="${dragSection}"]`);
          if (section) {
            section.style.left = x + "px";
            section.style.top = y + "px";
            section.classList.add("dragging");
          }
        }
      }

      function sectionUp() {
        if (dragSection === null) return;
        let section = document.querySelector(`[data-index="${dragSection}"]`);
        if (section) section.classList.remove("dragging");
        if (!moved) {
          toggleSection(dragSection);
        } else {
          data.sections[dragSection].z =
            ++data.nextZ;
          save();
        }
        document.removeEventListener("mousemove", sectionMove);
        document.removeEventListener("mouseup", sectionUp);
        dragSection = null;
      }
      /* LINK DRAG */
      let draggedLink = null;

      function linkDragStart(e, s, l) {
        draggedLink = {
          section: s,
          index: l
        };
        e.currentTarget.classList.add("dragging");
      }

      function linkDragOver(e, s, l) {
        e.preventDefault();
        if (!draggedLink) return;
        if (draggedLink.section === s && draggedLink.index === l) return;
        showDropLine(e.currentTarget);
      }

      function linkDrop(e, s, l) {
        e.preventDefault();
        removeDropLine();
        if (!draggedLink) return;
        let item = data.sections[draggedLink.section].links.splice(draggedLink.index, 1)[0];
        if (draggedLink.section === s && draggedLink.index < l) {
          l--;
        }
        data.sections[s].links.splice(l, 0, item);
        draggedLink = null;
        save();
      }

      function showDropLine(element) {
        removeDropLine();
        let line = document.createElement("div");
        line.className = "drop-line";
        element.parentNode.insertBefore(line, element);
      }

      function clearDrop() {
        removeDropLine();
      }

      function removeDropLine() {
        let line = document.querySelector(".drop-line");
        if (line) line.remove();
      }
      /* BACKGROUND */
      function changeBackground() {
        let url = prompt("Background image URL:");
        if (url) {
          data.background = url;
          save();
        }
      }
      /* JSON */
      function exportJSON() {
        let blob = new Blob(
          [
            JSON.stringify(data, null, 4)
          ], {
            type: "application/json"
          });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "shortcuts.json";
        a.click();
      }

      function importJSON() {
        document.getElementById("jsonModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("jsonModal").style.display = "none";
      }

      function loadJSON() {
        try {
          data = JSON.parse(document.getElementById("jsonInput").value);
          normalize();
          save();
          closeModal();
        } catch {
          alert("Invalid JSON");
        }
      }
      render();
    </script>
  </body>
</html>
