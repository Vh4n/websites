<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shortcuts</title>
    <style>
      :root {
        --card: rgba(27, 27, 27, .82);
        --hover: #252525;
        --text: #eee;
        --accent: #4da3ff;
        --border: #333;
        --shadow: 0 8px 25px rgba(0, 0, 0, .35);
        --background-overlay: rgba(0, 0, 0, .10);
      }

      body.light {
        --card: rgba(255, 255, 255, .85);
        --hover: #e9e9e9;
        --text: #111;
        --accent: #1677ff;
        --border: #ccc;
        --shadow: 0 8px 25px rgba(0, 0, 0, .15);
        --background-overlay: rgba(255, 255, 255, .10);
      }

      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: auto;
        color: var(--text);
        background:
          linear-gradient(var(--background-overlay), var(--background-overlay)),
          var(--background-image, none);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      #pageTitle {
        position: absolute;
        left: 25px;
        top: 20px;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
        z-index: 5000;
        color: #ddd;
      }

      body.light #pageTitle {
        color: #ddd;
      }

      #pageTitle input {
        font-size: 28px;
        background: #111;
        color: white;
        border: 1px solid var(--accent);
        border-radius: 6px;
        padding: 4px 8px;
      }

      .topButtons {
        position: absolute;
        right: 25px;
        top: 20px;
        display: flex;
        gap: 8px;
        z-index: 5000;
      }

      .desktop {
        position: relative;
        width: 100%;
        min-height: 100vh;
      }

      .section {
        position: absolute;
        width: 340px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .section-header {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
      }

      .drag-handle {
        cursor: grab;
        color: #999;
        font-size: 20px;
        user-select: none;
      }

      .drag-handle:active {
        cursor: grabbing;
      }

      .sectionName {
        flex: 1;
        font-weight: bold;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
      }

      .sectionName:hover {
        text-decoration: underline;
      }

      .sectionName input {
        width: 100%;
        background: #111;
        color: white;
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 2px 5px;
      }

      body.light .sectionName input {
        background: white;
        color: #111;
      }

      .iconButton {
        background: none;
        border: none;
        color: #888;
        font-size: 17px;
        cursor: pointer;
        padding: 2px 5px;
      }

      .iconButton:hover {
        color: var(--text);
      }

      .links {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .link {
        display: flex;
        align-items: center;
        padding: 8px;
        border-radius: 8px;
        transition: .15s;
        cursor: grab;
      }

      .link.dragging {
        opacity: .4;
      }

      .link:hover {
        background: var(--hover);
      }

      .link a {
        flex: 1;
        color: var(--accent);
        text-decoration: none;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .drop-line {
        height: 3px;
        background: #1677ff;
        border-radius: 5px;
        margin: 3px 0;
      }

      .addLinkButton {
        width: calc(100% - 20px);
        margin: 0 10px 10px;
      }

      button {
        background: #222;
        color: white;
        border: 1px solid #444;
        border-radius: 7px;
        padding: 7px 12px;
        cursor: pointer;
      }

      button:hover {
        background: #333;
      }

      body.light button {
        background: #fff;
        color: #111;
        border-color: #bbb;
      }

      body.light button:hover {
        background: #e5e5e5;
      }

      .addSection {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: #1677ff !important;
        color: white !important;
        border: none !important;
        z-index: 6000;
      }

      .exportBox {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: flex;
        gap: 8px;
        z-index: 6000;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .7);
        justify-content: center;
        align-items: center;
        z-index: 7000;
      }

      .modalBox {
        width: min(500px, 90vw);
        background: var(--card);
        padding: 20px;
        border-radius: 12px;
        color: var(--text);
      }

      textarea {
        width: 100%;
        height: 260px;
        resize: none;
        background: #111;
        color: white;
        border: 1px solid #444;
      }

      body.light textarea {
        background: #fff;
        color: #111;
      }

      @media(max-width:700px) {
        #pageTitle {
          left: 15px;
          top: 15px;
          font-size: 24px;
        }

        .topButtons {
          top: 15px;
          right: 15px;
        }

        .desktop {
          padding-top: 70px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 15px;
        }

        .section {
          position: relative !important;
          left: auto !important;
          top: auto !important;
          width: 92vw;
        }

        .exportBox {
          right: 10px;
          bottom: 10px;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="pageTitle"></div>
    <div class="topButtons">
      <button onclick="changeBackground()">Background</button>
      <button onclick="toggleTheme()" id="themeButton">☀</button>
    </div>
    <div id="desktop" class="desktop"></div>
    <button class="addSection" onclick="addSection()"> + Section </button>
    <div class="exportBox">
      <button onclick="exportJSON()">Export</button>
      <button onclick="importJSON()">Import</button>
    </div>
    <div class="modal" id="jsonModal">
      <div class="modalBox">
        <h3>Import JSON</h3>
        <textarea id="jsonInput"></textarea>
        <br>
        <br>
        <button onclick="loadJSON()">Load</button>
        <button onclick="closeModal()">Cancel</button>
      </div>
    </div>
    <script>
      let data = JSON.parse(localStorage.getItem("favorites")) || {
        title: "Shortcuts",
        background: "",
        theme: "dark",
        nextZ: 1,
        sections: []
      };

      function normalize() {
        if (!data.nextZ) data.nextZ = 1;
        if (!data.theme) data.theme = "dark";
        data.sections.forEach((s, i) => {
          if (s.x == null) s.x = 60 + i * 30;
          if (s.y == null) s.y = 80 + i * 30;
          if (s.z == null) s.z = i + 1;
          if (s.collapsed == null) s.collapsed = false;
          if (!s.links) s.links = [];
        });
        applyTheme();
      }

      function applyTheme() {
        document.body.classList.toggle("light", data.theme === "light");
        document.getElementById("themeButton").innerHTML = data.theme === "dark" ? "☀" : "🌙";
      }
      normalize();

      function save() {
        localStorage.setItem("favorites", JSON.stringify(data));
        applyTheme();
        render();
      }

      function toggleTheme() {
        data.theme = data.theme === "dark" ? "light" : "dark";
        save();
      }

      function render() {
        document.getElementById("pageTitle").innerHTML = data.title;
        if (data.background) {
          document.body.style.setProperty("--background-image", `url("${data.background}")`);
        }
        let html = "";
        data.sections.forEach((section, s) => {
          html += `


							<div class="section"
style="left:${section.x}px;top:${section.y}px;z-index:${section.z}"
data-index="${s}">
								<div class="section-header">
									<div class="drag-handle"
onmousedown="startDrag(event,${s})">
☰
</div>
									<div class="sectionName"
onclick="toggleSection(${s})"
ondblclick="event.stopPropagation();editSectionTitle(${s})">
${section.title}
</div>
									<button class="iconButton"
onclick="event.stopPropagation();editSectionTitle(${s})">
✏
</button>
									<button class="iconButton"
onclick="event.stopPropagation();deleteSection(${s})">
×
</button>
								</div>

`;
          if (!section.collapsed) {
            html += `


								<div class="links">

`;
            section.links.forEach((link, l) => {
              html += `


									<div class="link"
draggable="true"
ondragstart="linkDragStart(event,${s},${l})"
ondragover="linkDragOver(event,${s},${l})"
ondrop="linkDrop(event,${s},${l})"
ondragleave="clearDrop()">
										<a href="${link.url}">
${link.title}
</a>
										<button class="iconButton"
onclick="deleteLink(${s},${l})">
×
</button>
									</div>

`;
            });
            html += `


								</div>
								<button class="addLinkButton"
onclick="addLink(${s})">
+ Add Link
</button>

`;
          }
          html += `


							</div>

`;
        });
        document.getElementById("desktop").innerHTML = html;
      }
      document.getElementById("pageTitle").onclick = function() {
        let input = document.createElement("input");
        input.value = data.title;
        this.innerHTML = "";
        this.appendChild(input);
        input.focus();
        input.onkeydown = function(e) {
          if (e.key === "Enter") {
            data.title = this.value.trim() || "Shortcuts";
            save();
          }
        };
      };

      function toggleSection(i) {
        data.sections[i].collapsed = !data.sections[i].collapsed;
        save();
      }

      function editSectionTitle(i) {
        let div = document.getElementById("sectionTitle" + i);
        if (!div) return;
        let input = document.createElement("input");
        input.value = data.sections[i].title;
        div.innerHTML = "";
        div.appendChild(input);
        input.focus();
        input.select();
        input.onkeydown = function(e) {
          if (e.key === "Enter") {
            data.sections[i].title = this.value.trim() || "Section";
            save();
          }
        };
        input.onblur = function() {
          data.sections[i].title = this.value.trim() || "Section";
          save();
        };
      }

      function addSection() {
        let title = prompt("Section name:");
        if (!title) return;
        data.sections.push({
          title: title,
          collapsed: false,
          x: 60,
          y: 80,
          z: ++data.nextZ,
          links: []
        });
        save();
      }

      function deleteSection(i) {
        if (confirm("Delete section?")) {
          data.sections.splice(i, 1);
          save();
        }
      }

      function addLink(section) {
        let url = prompt("Website URL:");
        if (!url) return;
        if (!url.startsWith("http")) url = "https://" + url;
        let title;
        try {
          title = new URL(url).hostname.replace("www.", "");
        } catch {
          title = url;
        }
        let custom = prompt("Link title:", title);
        if (custom) title = custom;
        data.sections[section].links.push({
          title: title,
          url: url
        });
        save();
      }

      function deleteLink(s, l) {
        data.sections[s].links.splice(l, 1);
        save();
      }
      let dragSection = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      function startDrag(e, index) {
        if (e.target.classList.contains("iconButton") || e.target.tagName === "INPUT") {
          return;
        }
        e.preventDefault();
        dragSection = index;
        data.sections[index].z = ++data.nextZ;
        let section = data.sections[index];
        dragOffsetX = e.clientX - section.x;
        dragOffsetY = e.clientY - section.y;
        document.addEventListener("mousemove", dragMove);
        document.addEventListener("mouseup", dragEnd);
      }

      function dragMove(e) {
        if (dragSection === null) return;
        let x = e.clientX - dragOffsetX;
        let y = e.clientY - dragOffsetY;
        let maxX = Math.max(0, window.innerWidth - 340);
        if (x < 0) x = 0;
        if (y < 0) y = 0;
        if (x > maxX) x = maxX;
        data.sections[dragSection].x = x;
        data.sections[dragSection].y = y;
        let el = document.querySelector(`[data-index="${dragSection}"]`);
        if (el) {
          el.style.left = x + "px";
          el.style.top = y + "px";
          el.style.zIndex = data.sections[dragSection].z;
        }
      }

      function dragEnd() {
        document.removeEventListener("mousemove", dragMove);
        document.removeEventListener("mouseup", dragEnd);
        dragSection = null;
        save();
      }
      let draggedLink = null;

      function linkDragStart(e, section, index) {
        draggedLink = {
          section: section,
          index: index
        };
        e.currentTarget.classList.add("dragging");
      }

      function linkDragOver(e, section, index) {
        e.preventDefault();
        if (!draggedLink) return;
        if (draggedLink.section === section && draggedLink.index === index) return;
        showDropLine(e.currentTarget);
      }

      function linkDrop(e, section, index) {
        e.preventDefault();
        removeDropLine();
        if (!draggedLink) return;
        let fromSection = draggedLink.section;
        let fromIndex = draggedLink.index;
        let item = data.sections[fromSection].links.splice(fromIndex, 1)[0];
        if (fromSection === section && fromIndex < index) {
          index--;
        }
        data.sections[section].links.splice(index, 0, item);
        draggedLink = null;
        save();
      }

      function showDropLine(element) {
        removeDropLine();
        let line = document.createElement("div");
        line.className = "drop-line";
        element.parentNode.insertBefore(line, element);
      }

      function clearDrop() {
        removeDropLine();
      }

      function removeDropLine() {
        let line = document.querySelector(".drop-line");
        if (line) {
          line.remove();
        }
      }

      function changeBackground() {
        let url = prompt("Background image URL:");
        if (url) {
          data.background = url;
          save();
        }
      }

      function exportJSON() {
        let blob = new Blob(
          [
            JSON.stringify(data, null, 4)
          ], {
            type: "application/json"
          });
        let a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "shortcuts.json";
        a.click();
      }

      function importJSON() {
        document.getElementById("jsonModal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("jsonModal").style.display = "none";
      }

      function loadJSON() {
        try {
          data = JSON.parse(document.getElementById("jsonInput").value);
          normalize();
          save();
          closeModal();
        } catch {
          alert("Invalid JSON");
        }
      }
      render();
    </script>
  </body>
</html>
