<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Randomizer</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


body {
    margin:0;
    background:#121212;
    color:#e0e0e0;
    padding:30px;
}


.container {
    max-width:900px;
    margin:auto;
}


h1 {
    text-align:center;
    color:white;
    margin-bottom:30px;
}


.card {
    background:#1e1e1e;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
}


.section-title {
    cursor:pointer;
    color:#90caf9;
    user-select:none;
    list-style:none;
}


.section-title::marker,
.section-title::-webkit-details-marker {
    display:none;
}


.section-title:hover {
    color:#bbdefb;
}


.content {
    margin-top:20px;
}


.row {
    display:flex;
    gap:15px;
    align-items:center;
}


.column {
    flex:1;
}


label {
    display:block;
    margin-bottom:5px;
}


input {

    width:100%;
    padding:12px;

    border-radius:8px;

    border:1px solid #444;

    background:#2b2b2b;

    color:white;

    font-size:16px;

}



button {

    padding:12px 18px;

    border:none;

    border-radius:8px;

    background:#1976d2;

    color:white;

    cursor:pointer;

    font-size:16px;

}



button:hover {

    background:#1565c0;

}



.action-row {

    display:flex;

    align-items:center;

    gap:20px;

    margin-top:20px;

}



.result {

    background:#252525;

    border-radius:8px;

    padding:12px 20px;

    min-width:120px;

    text-align:center;

    color:#81c784;

    font-size:22px;

}



.loading {

    height:20px;

    background:#333;

    border-radius:10px;

    overflow:hidden;

    display:none;

    margin-top:20px;

}



.loading-bar {

    height:100%;

    width:0%;

    background:#1976d2;

}



.list {

    margin-top:20px;

}



.list-item {

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:#292929;

    padding:12px;

    border-radius:8px;

    margin-bottom:8px;

}



.remove {

    background:#d32f2f;

    padding:5px 10px;

}



.remove:hover {

    background:#b71c1c;

}



.empty {

    text-align:center;

    color:#888;

}


</style>


</head>


<body>


<div class="container">


<h1>Randomizer</h1>



<div class="card">


<h2 class="section-title" onclick="toggleSection('numberSection')">
Number Randomizer
</h2>



<div id="numberSection" class="content">



<div class="row">


<div class="column">

<label>Initial Number</label>

<input 
type="number"
id="minNumber"
placeholder="example:0">

</div>



<div class="column">

<label>Final Number</label>

<input
type="number"
id="maxNumber"
placeholder="example:20">

</div>


</div>



<div class="action-row">

<button onclick="randomizeNumber()">
Randomize
</button>


<div class="result" id="numberResult">
-
</div>


</div>


<div class="loading" id="numberLoading">

<div class="loading-bar" id="numberLoadingBar"></div>

</div>


</div>


</div>





<div class="card">


<h2 class="section-title" onclick="toggleSection('listSection')">
List Randomizer
</h2>



<div id="listSection" class="content">



<div class="row">


<button onclick="addItem()">
Add
</button>


<div class="column">

<input
type="text"
id="itemInput"
placeholder="example: blue">

</div>


</div>





<div class="action-row">


<button onclick="randomizeList()">
Randomize
</button>


<div class="result" id="listResult">
-
</div>


</div>





<div class="loading" id="listLoading">

<div class="loading-bar" id="listLoadingBar"></div>

</div>





<div class="list" id="itemList"></div>


</div>


</div>


</div>






<script>


let items=[];



function toggleSection(id){

    let section=document.getElementById(id);

    if(section.style.display==="none"){
        section.style.display="block";
    }
    else{
        section.style.display="none";
    }

}





function startLoading(type,callback){


    const loading=document.getElementById(type+"Loading");

    const bar=document.getElementById(type+"LoadingBar");


    loading.style.display="block";

    bar.style.width="0%";


    let progress=0;


    let interval=setInterval(()=>{


        progress+=4;


        bar.style.width=progress+"%";


        if(progress>=100){

            clearInterval(interval);

            loading.style.display="none";

            callback();

        }


    },40);


}







function randomizeNumber(){


    const min=Number(document.getElementById("minNumber").value);

    const max=Number(document.getElementById("maxNumber").value);



    if(!Number.isInteger(min) || !Number.isInteger(max)){

        document.getElementById("numberResult").innerHTML="Integers only";

        return;

    }



    if(min>max){

        document.getElementById("numberResult").innerHTML="Invalid range";

        return;

    }




    startLoading("number",()=>{


        let value=Math.floor(
            Math.random()*(max-min+1)
        )+min;


        document.getElementById("numberResult").innerHTML=value;


    });


}






function addItem(){


    let input=document.getElementById("itemInput");


    let value=input.value.trim();



    if(value===""){
        return;
    }



    items.push(value);


    input.value="";


    renderList();


}





function renderList(){


    let list=document.getElementById("itemList");


    list.innerHTML="";



    if(items.length===0){

        list.innerHTML="<div class='empty'>No elements added</div>";

        return;

    }



    items.forEach((item,index)=>{


        let div=document.createElement("div");


        div.className="list-item";


        div.innerHTML=
        `
        <span>${item}</span>

        <button class="remove" onclick="removeItem(${index})">
        ✖
        </button>
        `;


        list.appendChild(div);


    });


}







function removeItem(index){

    items.splice(index,1);

    renderList();

}






function randomizeList(){


    if(items.length===0){

        document.getElementById("listResult").innerHTML="Empty";

        return;

    }



    startLoading("list",()=>{


        let index=Math.floor(Math.random()*items.length);


        document.getElementById("listResult").innerHTML=
        items[index];


    });


}






document.addEventListener("keydown",(event)=>{


    if(event.key==="Enter"){


        if(
            document.activeElement.id==="minNumber" ||
            document.activeElement.id==="maxNumber"
        ){

            randomizeNumber();

        }



        if(document.activeElement.id==="itemInput"){

            addItem();

        }


    }


});




renderList();


</script>


</body>

</html>
